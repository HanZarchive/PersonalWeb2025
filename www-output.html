<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { font-family: Helvetica; padding: 20px; background-color: #111111; color: #fff; }
        header { margin-bottom: 20px; }
        h1 { color: #8ACE00; }
        h4 { color: #cacaca; }
        input, button { padding: 10px; margin-right: 10px; border-radius: 10px; border: none; }
        button { background-color: #8ACE00; color: white; cursor: pointer; }
        button:hover { background-color: #8ACE00; }
        .album-card {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #282828;
            border-radius: 8px;
            background-color: #181818;
        }
        .album-card img { border-radius: 5px; }
        a { color: #1DB954; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Daily Recommend</h1>
    <h4>Enter your mood then get a album recommendation and get some photos from the debut day!</h4>
    <h3>
        Let's get started!
    </h3>
    <select id="mood-input">
        <option value="">-- Select your mood --</option>
        <option value="excited">Excited</option>
        <option value="relaxed">Relaxed</option>
        <option value="sad">Sad</option>
        <option value="focused">Focused</option>
        <option value="calm">Calm</option>
        <option value="angry">Angry</option>
        <option value="romantic">Romantic</option>
        <option value="energetic">Energetic</option>
        <option value="happy">Happy</option>
    </select>

    <button id="recommend-button">Recommend me</button>
    
    <main id="main-content">
    </main>
    <section id="spotifytrack"></section>
    <section id="nasaimage"></section>
    <script>
        const triggerButton = document.getElementById('recommend-button');
        const mainContent = document.getElementById('main-content')

        const getSpotifyToken = async () => {
            const clientID = 'b8c4f39a900449289c3145fb2b56371d'; 
            const clientSecret = '9420043e1fd140d68488bc783cb5d5cc';

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'grant_type=client_credentials&client_id=' + clientID + '&client_secret=' + clientSecret });

            const data = await response.json();
            console.log(data)

            return data.access_token;
        }

        const fetchSpotifyData = () => {
            const moodInput = document.getElementById('mood-input').value
            const MOOD_TO_GENRE = {
            'excited': 'dance',
            'relaxed': 'ambient',
            'sad': 'blues',
            'focused': 'classical',
            'calm': 'jazz',
            'angry': 'rock',
            'romantic': 'soul',
            'energetic': 'electronic',
            'happy': 'pop'
            }
            const genre = MOOD_TO_GENRE[moodInput]

            console.log("Mood input:", moodInput)
            console.log('Mapped genre:',genre)

            if (!genre) {
                mainContent.innerHTML = '<p>Please select a valid mood</p>'
                return
            }

            getSpotifyToken()
                .then(token => {
                    const randomOffset = Math.floor(Math.random() * 50)
                    const searchURL = `https://api.spotify.com/v1/search?q=genre:"${genre}"&type=track&limit=50&offset=${randomOffset}`
                    
                    return fetch(searchURL, {
                        headers: {
                            'Authorization': 'Bearer ' + token 
                        }
                    })
                })
                .then(response => response.json())
                .then(data => appendSpotifyData(data))
        }

        const appendSpotifyData = (data) => {
            console.log('full data:', data)

            const tracks = data.tracks.items

            if (!tracks || tracks.length === 0) {
                console.log('No recommendations.');
                return
            }
            const randomIndex = Math.floor(Math.random() * tracks.length)
            const track = tracks[randomIndex]

            const trackName = track.name                    
            const albumName = track.album.name              
            const artistName = track.artists[0].name        
            const albumImage = track.album.images[0].url    
            const releaseDate = track.album.release_date    
            const spotifyUrl = track.external_urls.spotify  

            console.log('Name:', trackName)
            console.log('Artist:', artistName)
            console.log('Album:', albumName)
            console.log('Cover:', albumImage)
            console.log('Release date:', releaseDate)

            mainContent.innerHTML = `
            <h2>${trackName}</h2>
            <img src="${albumImage}" alt="${albumName}" style="max-width: 200px;">
            <p><strong>Artist:</strong> ${artistName}</p>
            <p><strong>Album:</strong> ${albumName}</p>
            <p><strong>Release Date:</strong> ${releaseDate}</p>
            <a href="${spotifyUrl}" target="_blank">Listen on Spotify</a>
            `
            fetchEarthPic(releaseDate)
        }

        const fetchEarthPic = (releaseDate) => {
            console.log('Fetching Earth Photos for the date: ', releaseDate);

            const [year, month] = releaseDate.split('-');

            const tryDate = (attempt = 0) => {
                if (attempt >= 20) {
                    console.log('No Earth images found after multiple attempts');
                    const earthSection = document.getElementById('nasaimage');
                    earthSection.innerHTML = `<p>No Earth images found for the release date or nearby dates.</p>`;
                    return;
                }
                const randomDay = String(Math.floor(Math.random() * 28) + 1).padStart(2, '0');
                const randomDate = `${year}-${month}-${randomDay}`;

                console.log(`Attempt ${attempt + 1}: Trying date ${randomDate}`);

                const nasaURL = `https://epic.gsfc.nasa.gov/api/natural/date/${randomDate}`;

                fetch(nasaURL)
                    .then(response => response.json())
                    .then(data => {
                        console.log('NASA EPIC API Response:', data);
                        if (!data || data.length === 0) {
                            console.log('Try again...');
                            tryDate(attempt + 1);
                            return;
                        }

                        // if (data && data.length > 0) {
                            console.log('NASA EPIC API Response:', data);
                            const photo = data[0]; 
                            const date = new Date(photo.date);
                            const year = date.getFullYear();
                            const month = String(date.getMonth() + 1).padStart(2, '0');
                            const day = String(date.getDate()).padStart(2, '0');

                            const imageUrl = `https://epic.gsfc.nasa.gov/archive/natural/${year}/${month}/${day}/png/${photo.image}.png`;

                            console.log('Earth Image URL:', imageUrl);

                            const earthSection = document.getElementById('nasaimage');
                            earthSection.innerHTML = `
                                <h3>Earth Photo from ${randomDate}</h3>
                                <img src="${imageUrl}" alt="Earth Image" style="max-width: 50%;">
                            `;
                        // }
                        })
                        .catch(error => {
                            console.error('NASA EPIC API Error:', error);
                            tryDate(attempt + 1);
                        })
            }
            tryDate(0);
        }

        triggerButton.addEventListener("click", fetchSpotifyData)
    </script>
</body>
