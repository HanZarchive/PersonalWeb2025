<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Gaze Anxiety Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #222; /* 初始深色背景 */
            font-family: sans-serif;
            transition: background-color 0.1s; /* 颜色平滑过渡 */
        }

        #info {
            color: white;
            z-index: 10;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 10px;
        }

        /* 隐藏摄像头画面，只用来做数据分析，不显示给用户看 */
        #input_video {
            display: none; 
        }

        h1 { font-weight: 300; letter-spacing: 2px; }
        p { font-size: 1.2rem; color: #aaa; }
        .value { font-weight: bold; color: #fff; font-size: 1.5rem;}
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="info">
        <h1>THE GAZE (MVP Test)</h1>
        <p>焦虑值 (Anxiety Level): <span id="anxiety-display" class="value">0</span></p>
        <p>状态: <span id="status">正在加载模型...</span></p>
    </div>

    <video id="input_video"></video>

    <script>
        const videoElement = document.getElementById('input_video');
        const anxietyDisplay = document.getElementById('anxiety-display');
        const statusDisplay = document.getElementById('status');
        
        // --- 核心逻辑参数 ---
        let anxietyLevel = 0;
        const ANXIETY_MAX = 100;
        const RISE_SPEED = 0.8;    // 被凝视时，焦虑上升速度
        const DECAY_SPEED = 0.98;  // 无凝视时，焦虑衰减系数 (缓慢下降)
        let isStaring = false;     // 是否检测到凝视

        // --- 每一帧的逻辑循环 ---
        function updateLogic() {
            if (isStaring) {
                // 如果有人在看：焦虑值线性增加
                anxietyLevel += RISE_SPEED;
            } else {
                // 如果没人看：焦虑值缓慢衰减 (乘以系数实现滞后感)
                anxietyLevel *= DECAY_SPEED;
            }

            // 限制范围在 0 到 100 之间
            anxietyLevel = Math.max(0, Math.min(anxietyLevel, ANXIETY_MAX));

            // 更新界面文字
            anxietyDisplay.innerText = anxietyLevel.toFixed(1);

            // 更新背景颜色：从 绿色(平静) 到 红色(焦虑)
            // 0 -> rgb(50, 50, 50) (暗黑)
            // 100 -> rgb(200, 0, 0) (红)
            const red = Math.floor(anxietyLevel * 2); 
            const green = Math.floor(50 - anxietyLevel * 0.5);
            const blue = Math.floor(50 - anxietyLevel * 0.5);
            
            document.body.style.backgroundColor = `rgb(${red}, ${Math.max(0,green)}, ${Math.max(0,blue)})`;

            requestAnimationFrame(updateLogic);
        }

        // --- MediaPipe 设置 ---
        function onResults(results) {
            // results.multiFaceLandmarks 包含检测到的人脸数据
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                // 检测到人脸，视为"凝视"
                // 进阶版可以在这里计算脸部角度，目前 MVP 只要有人脸就算凝视
                isStaring = true;
                statusDisplay.innerText = "被凝视 (Staring)";
                statusDisplay.style.color = "#ff4444";
            } else {
                isStaring = false;
                statusDisplay.innerText = "无人 (Safe)";
                statusDisplay.style.color = "#44ff44";
            }
        }

        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onResults);

        // 启动摄像头
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        
        camera.start()
            .then(() => {
                statusDisplay.innerText = "摄像头已启动，请直视屏幕";
                updateLogic(); // 启动逻辑循环
            })
            .catch(err => {
                console.error(err);
                statusDisplay.innerText = "摄像头启动失败，请检查权限 (需在HTTPS或localhost下运行)";
            });

    </script>
</body>
</html>
